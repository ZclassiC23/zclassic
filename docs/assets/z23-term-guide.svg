<svg xmlns="http://www.w3.org/2000/svg" width="888" height="252" viewBox="0 0 888 252" role="img" aria-label="z23 zcode guide">
<rect width="888" height="252" rx="12" fill="#0b0f16"/>
<rect x="0.5" y="0.5" width="887" height="251" rx="11.5" fill="none" stroke="#243044"/>
<path d="M0 44 h888" stroke="#1a2432"/>
<circle cx="26" cy="22" r="5.5" fill="#ff6b5e"/><circle cx="46" cy="22" r="5.5" fill="#f2c14e"/><circle cx="66" cy="22" r="5.5" fill="#6bd18a"/>
<text x="444" y="27" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#66788c" text-anchor="middle">z23 zcode guide</text>
<text y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="24.0" textLength="92.4" lengthAdjust="spacing" fill="#eef4fb" font-weight="bold">zcode.guide</tspan></text>
<text y="97" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"></text>
<text y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="40.8" textLength="109.2" lengthAdjust="spacing" fill="#5d7186">mission      </tspan><tspan x="150.0" textLength="495.6" lengthAdjust="spacing" fill="#c3d2e2">  Tell Z23 what you want C23 software on this device to do.</tspan></text>
<text y="139" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="40.8" textLength="109.2" lengthAdjust="spacing" fill="#5d7186">next_action  </tspan><tspan x="150.0" textLength="277.2" lengthAdjust="spacing" fill="#c3d2e2">  Describe the behavior you want.</tspan></text>
<text y="160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="40.8" textLength="109.2" lengthAdjust="spacing" fill="#5d7186">start_command</tspan><tspan x="150.0" textLength="621.6" lengthAdjust="spacing" fill="#c3d2e2">  zcode work start --input='{"workspace":".","goal":"&lt;desired behavior&gt;"}'</tspan></text>
<text y="181" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="40.8" textLength="109.2" lengthAdjust="spacing" fill="#5d7186">journey      </tspan><tspan x="150.0" textLength="714.0" lengthAdjust="spacing" fill="#c3d2e2">  reuse C23 -&gt; create only missing code -&gt; build and test -&gt; show behavior -&gt; reprod…</tspan></text>
<text y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="40.8" textLength="109.2" lengthAdjust="spacing" fill="#5d7186">continue_rule</tspan><tspan x="150.0" textLength="487.2" lengthAdjust="spacing" fill="#c3d2e2">  Follow the next_safe_command returned by each work step.</tspan></text>
<text y="223" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" xml:space="preserve"><tspan x="40.8" textLength="109.2" lengthAdjust="spacing" fill="#5d7186">proof_view   </tspan><tspan x="150.0" textLength="529.2" lengthAdjust="spacing" fill="#c3d2e2">  Add details=true only when you want exact roots and receipts.</tspan></text>
</svg>
