<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="320" viewBox="0 0 1240 320" role="img" aria-label="DESCRIBE, REUSE, CREATE, SEE, KEEP, SHARE - the Z23 flow">
<title>DESCRIBE - REUSE - CREATE - SEE - KEEP - SHARE: the Z23 flow</title>
<rect width="1240" height="320" rx="16" fill="#0b0f16"/>
<rect x="0.5" y="0.5" width="1239" height="319" rx="15.5" fill="none" stroke="#243044"/>
<line x1="0" y1="96" x2="1240" y2="96" stroke="#1a2432"/>
<line x1="0" y1="272" x2="1240" y2="272" stroke="#1a2432"/>
<text x="620" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" font-weight="bold" letter-spacing="2" fill="#eef4fb">DESCRIBE &#8594; REUSE &#8594; CREATE &#8594; SEE &#8594; KEEP &#8594; SHARE</text>
<text x="620" y="78" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#66788c">Describe what you want. Your machine assembles it from a shared C23 commons.</text>

<!-- DESCRIBE -->
<rect x="42" y="118" width="176" height="136" rx="10" fill="#101725" stroke="#243044"/>
<rect x="42" y="118" width="176" height="3" rx="1.5" fill="#6bd18a"/>
<text x="58" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#6bd18a">01</text>
<text x="58" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#eef4fb">DESCRIBE</text>
<line x1="58" y1="188" x2="202" y2="188" stroke="#243044"/>
<text x="58" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">Say what the software</text>
<text x="58" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">should do, in your</text>
<text x="58" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">own words.</text>
<text x="228" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3d4d61">&#8594;</text>

<!-- REUSE -->
<rect x="238" y="118" width="176" height="136" rx="10" fill="#101725" stroke="#243044"/>
<rect x="238" y="118" width="176" height="3" rx="1.5" fill="#6db8f2"/>
<text x="254" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#6db8f2">02</text>
<text x="254" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#eef4fb">REUSE</text>
<line x1="254" y1="188" x2="398" y2="188" stroke="#243044"/>
<text x="254" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">Peers already have</text>
<text x="254" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">C23 that does part</text>
<text x="254" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">of it.</text>
<text x="424" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3d4d61">&#8594;</text>

<!-- CREATE -->
<rect x="434" y="118" width="176" height="136" rx="10" fill="#101725" stroke="#243044"/>
<rect x="434" y="118" width="176" height="3" rx="1.5" fill="#b79cf2"/>
<text x="450" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#b79cf2">03</text>
<text x="450" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#eef4fb">CREATE</text>
<line x1="450" y1="188" x2="594" y2="188" stroke="#243044"/>
<text x="450" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">Only the missing</text>
<text x="450" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">behavior is written,</text>
<text x="450" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">built and tested.</text>
<text x="620" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3d4d61">&#8594;</text>

<!-- SEE -->
<rect x="630" y="118" width="176" height="136" rx="10" fill="#101725" stroke="#243044"/>
<rect x="630" y="118" width="176" height="3" rx="1.5" fill="#f2c14e"/>
<text x="646" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#f2c14e">04</text>
<text x="646" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#eef4fb">SEE</text>
<line x1="646" y1="188" x2="790" y2="188" stroke="#243044"/>
<text x="646" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">Run it. Watch the</text>
<text x="646" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">change happen before</text>
<text x="646" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">anything is published.</text>
<text x="816" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3d4d61">&#8594;</text>

<!-- KEEP -->
<rect x="826" y="118" width="176" height="136" rx="10" fill="#101725" stroke="#243044"/>
<rect x="826" y="118" width="176" height="3" rx="1.5" fill="#ef8b6a"/>
<text x="842" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#ef8b6a">05</text>
<text x="842" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#eef4fb">KEEP</text>
<line x1="842" y1="188" x2="986" y2="188" stroke="#243044"/>
<text x="842" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">Accept one exact</text>
<text x="842" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">version, by hand.</text>
<text x="842" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">It stays yours.</text>
<text x="1012" y="192" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#3d4d61">&#8594;</text>

<!-- SHARE -->
<rect x="1022" y="118" width="176" height="136" rx="10" fill="#101725" stroke="#243044"/>
<rect x="1022" y="118" width="176" height="3" rx="1.5" fill="#5fd3c4"/>
<text x="1038" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="bold" letter-spacing="1" fill="#5fd3c4">06</text>
<text x="1038" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="bold" letter-spacing="1" fill="#eef4fb">SHARE</text>
<line x1="1038" y1="188" x2="1182" y2="188" stroke="#243044"/>
<text x="1038" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">Peers fetch it,</text>
<text x="1038" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">reproduce it,</text>
<text x="1038" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c3d2e2">and preserve it.</text>

<text x="620" y="300" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#5d7186">one machine &#183; one commons &#183; no central registry &#183; exact versions that outlive their tools</text>
</svg>
