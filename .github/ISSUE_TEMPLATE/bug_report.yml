name: Bug report
description: Something the node does that it should not, or fails to do that it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Two of the fields below are specific to this
        project and do most of the triage work — the `zclassic23 status` output
        and the consensus question. Please don't skip them.

        Security vulnerabilities do **not** go here: follow
        [`.github/SECURITY.md`](https://github.com/ZclassiC23/zclassic/blob/main/.github/SECURITY.md)
        instead, so the report stays private until there is a fix.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the node do, and what did you expect instead?
      placeholder: |
        The node reports at_tip but getblockcount stays at 3,150,000 for an hour.
        I expected the height to keep climbing, or a named blocker explaining why not.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The exact commands, flags, and datadir state. A fresh-datadir repro is
        worth far more than a description of a long-lived one — if you can get
        it to happen on a new datadir, say so.
      render: shell
    validations:
      required: true

  - type: textarea
    id: status
    attributes:
      label: Output of `zclassic23 status`
      description: >
        Paste the whole thing (`build/bin/zclassic23 status`, or add
        `--format=json` for the typed envelope). This one command carries
        height, header height, gap, peer count, sync state, health, and the
        named primary blocker — it usually identifies the failure class before
        anyone reads a log. If the node will not start far enough to answer,
        write "node does not reach the command surface" and paste the last
        ~40 lines of `<datadir>/node.log` instead.
      render: shell
    validations:
      required: true

  - type: dropdown
    id: consensus
    attributes:
      label: Does this change consensus?
      description: >
        Read this before you spend a weekend on a fix. zclassic23 must stay
        bit-for-bit consensus-compatible with `zclassicd`. A change to Equihash
        parameters, activation heights, or block/transaction validity is
        **declined on principle** — even if framed as opt-in, miner-signaled, or
        a "sidegrade" — because a consensus change must never ship to zclassic23
        first. If you report one anyway we will thank you, credit the idea, and
        decline the change; we may reimplement any non-consensus part of it
        ourselves. Non-consensus reports are judged purely on merit. Full
        policy: `docs/CONSENSUS_PARITY_DOCTRINE.md`.

        If you are unsure, pick "I'm not sure" — that is a useful answer, not a
        failure to do homework.
      options:
        - "No — this is a bug in non-consensus code (sync, wallet, RPC, explorer, Tor, CLI, docs)"
        - "Yes — this would change block or transaction validity"
        - "I'm not sure"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Build
      description: >
        Commit or tag you built from, plus OS and compiler
        (`gcc --version`). `zclassic23 status --format=json` reports the
        running `build_commit`.
      placeholder: "aba27f574, Ubuntu 24.04, gcc 14.2"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Relevant `node.log` excerpts, `zclassic23 ops logs --pattern='error|warn'`
        output, `zclassic23 dumpstate reducer_frontier`, or notes on what you
        already ruled out.
    validations:
      required: false
